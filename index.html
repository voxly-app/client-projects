<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Chat Bot</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      #chat {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        background: #f6f8ff;
      }

      .message {
        margin-bottom: 12px;
        max-width: 80%;
        line-height: 1.4;
      }

      .message.user {
        align-self: flex-end;
        background: #1f2937;
        color: white;
        padding: 12px 14px;
        border-radius: 16px 16px 0 16px;
      }

      .message.bot {
        align-self: flex-start;
        background: white;
        color: #111827;
        padding: 12px 14px;
        border-radius: 16px 16px 16px 0;
        border: 1px solid #e5e7eb;
      }

      #input-area {
        display: flex;
        border-top: 1px solid #d1d5db;
        padding: 12px;
        background: white;
      }

      #message {
        flex: 1;
        font-size: 16px;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        margin-right: 8px;
      }

      #send {
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      #send:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #footer {
        text-align: center;
        padding: 12px;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main id="chat"></main>

    <div id="input-area">
      <input id="message" type="text" placeholder="Type a message..." autocomplete="off" />
      <button id="send">Send</button>
    </div>

    <div id="footer">Powered by a simple Flask chat API</div>

    <script>
      const chat = document.getElementById("chat");
      const messageInput = document.getElementById("message");
      const sendButton = document.getElementById("send");

      function appendMessage(text, role) {
        const el = document.createElement("div");
        el.className = `message ${role}`;
        el.textContent = text;
        chat.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
      }

      async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        appendMessage(text, "user");
        messageInput.value = "";
        sendButton.disabled = true;

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });

          const data = await res.json();
          appendMessage(data?.reply ?? "(no response)", "bot");
        } catch (err) {
          appendMessage("Sorry, I couldn't reach the server.", "bot");
        }

        sendButton.disabled = false;
        messageInput.focus();
      }

      sendButton.addEventListener("click", sendMessage);
      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          sendMessage();
        }
      });

      appendMessage("Hi! I’m your bot. Ask me something.", "bot");
      messageInput.focus();
    </script>
  </body>
</html>
